<header class="navbar" [class.scrolled]="isScrolled()">
  <div class="container navbar-container">
    <!-- Brand Logo -->
    <a routerLink="/" class="navbar-brand" (click)="closeMobileMenu()">
      <div class="brand-symbol">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-icon">
          <rect width="32" height="32" rx="8" fill="url(#logo-grad)" />
          <path d="M8 8V24M8 8H18C20.2 8 22 9.8 22 12C22 14.2 20.2 16 18 16H8M8 16H18C20.5 16 22.5 17.8 22.5 20C22.5 22.2 20.5 24 18 24H8" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4f46e5" />
              <stop offset="0.5" stop-color="#06b6d4" />
              <stop offset="1" stop-color="#10b981" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Bachir<span class="accent-dot">.</span>dev</span>
        <span class="brand-status">
          <span class="pulse-dot"></span> Tech Lead
        </span>
      </div>
    </a>

    <!-- Desktop Navigation Links: Accueil, Compétences, Projets, Certificats, À propos, Contact -->
    <nav class="nav-links" aria-label="Navigation Principale">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        Accueil
      </a>
      <a routerLink="/skills" routerLinkActive="active" class="nav-item">
        Compétences
      </a>
      <a routerLink="/projects" routerLinkActive="active" class="nav-item">
        Projets
      </a>
      <a routerLink="/certifications" routerLinkActive="active" class="nav-item">
        Certificats
      </a>
      <a routerLink="/about" routerLinkActive="active" class="nav-item">
        À propos
      </a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-item">
        Contact
      </a>
    </nav>

    <!-- Header Actions (Theme Toggle & CTA) -->
    <div class="navbar-actions">
      <!-- Dark/Light Theme Toggle Button -->
      <button
        class="theme-toggle-btn btn-icon"
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.currentTheme() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'"
        [title]="themeService.currentTheme() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'"
      >
        @if (themeService.currentTheme() === 'dark') {
          <!-- Sun Icon -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <!-- Moon Icon -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <!-- Direct LinkedIn Profile Link -->
      <a
        [href]="portfolioService.personalInfo().linkedin"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-icon linkedin-nav-btn"
        aria-label="Profil LinkedIn de Bachir Karroudi"
        title="Voir mon profil LinkedIn"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect x="2" y="9" width="4" height="12"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>

      <!-- Desktop Contact CTA -->
      <a routerLink="/contact" class="btn btn-primary btn-sm cta-btn">
        <span>Me Contacter</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>

      <!-- Mobile Hamburger Button -->
      <button
        class="mobile-toggle-btn btn-icon"
        (click)="toggleMobileMenu()"
        [attr.aria-label]="isMobileMenuOpen() ? 'Fermer le menu' : 'Ouvrir le menu de navigation'"
        [attr.aria-expanded]="isMobileMenuOpen()"
      >
        @if (!isMobileMenuOpen()) {
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  @if (isMobileMenuOpen()) {
    <div class="mobile-drawer" role="dialog" aria-modal="true">
      <div class="mobile-drawer-content">
        <nav class="mobile-nav-links">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()" class="mobile-nav-item">
            <span class="mobile-nav-num">01</span>
            <span>Accueil</span>
          </a>
          <a routerLink="/skills" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-item">
            <span class="mobile-nav-num">02</span>
            <span>Compétences</span>
          </a>
          <a routerLink="/projects" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-item">
            <span class="mobile-nav-num">03</span>
            <span>Projets</span>
          </a>
          <a routerLink="/certifications" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-item">
            <span class="mobile-nav-num">04</span>
            <span>Certificats</span>
          </a>
          <a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-item">
            <span class="mobile-nav-num">05</span>
            <span>À propos</span>
          </a>
          <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-item">
            <span class="mobile-nav-num">06</span>
            <span>Contact</span>
          </a>
        </nav>

        <div class="mobile-drawer-footer">
          <a routerLink="/contact" (click)="closeMobileMenu()" class="btn btn-primary full-w">
            <span>Discuter d'une opportunité</span>
          </a>
        </div>
      </div>
    </div>
  }
</header>
