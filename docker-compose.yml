services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: bachir-karroudi/portfolio:latest
    container_name: bachir-portfolio
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.portfolio.entrypoints=web"
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
