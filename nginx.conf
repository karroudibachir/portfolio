server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip pour des performances optimales
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # En-têtes de Sécurité HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Point de contrôle de santé (Health Check)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Cache immuable (1 an) pour les assets statiques hashés
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|webp|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Ne jamais mettre en cache index.html pour garantir les mises à jour immédiates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # Redirection SPA : toutes les routes Angular non-fichiers renvoient vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gestion personnalisée des erreurs
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
