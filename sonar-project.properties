# ===================================================================
# Configuration SonarQube / SonarCloud — Portfolio Bachir Karroudi
# ===================================================================

# Organisation SonarCloud (nom du compte ou organisation GitHub)
sonar.organization=karroudibachir

# Clé unique et nom du projet générés par SonarCloud pour le dépôt karroudibachir/portfolio
sonar.projectKey=karroudibachir_portfolio
sonar.projectName=portfolio
sonar.projectVersion=1.0.0

# Répertoire source analysé (TypeScript / Angular)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Exclusions des fichiers générés, dépendances et assets statiques
sonar.exclusions=**/node_modules/**,**/dist/**,public/**,**/*.spec.ts,**/*.html,**/*.scss

# Encodage des fichiers
sonar.sourceEncoding=UTF-8

# Configuration TypeScript & Angular
sonar.typescript.tsconfigPath=tsconfig.app.json

# Rapports de couverture de tests (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Qualité & Bonnes pratiques
sonar.qualitygate.wait=false
sonar.scm.disabled=false
