name: 🚀 CI/CD → Render

on:
  push:
    branches: [main]
  workflow_dispatch:          # allow manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # cancel older runs on the same branch

jobs:
  # ─────────────────────────────────────────────────
  # 1. BUILD — compile Angular for production
  # ─────────────────────────────────────────────────
  build:
    name: 🔨 Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history needed for SonarQube blame

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-portfolio
          path: dist/portfolio/browser/
          retention-days: 1

  # ─────────────────────────────────────────────────
  # 2. SONARQUBE — static analysis (non-blocking)
  # ─────────────────────────────────────────────────
  sonarqube:
    name: 🔍 SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true     # never blocks deployment

    # Only run when the required secrets are configured
    if: >
      vars.SONAR_HOST_URL != '' ||
      secrets.SONAR_TOKEN != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ─────────────────────────────────────────────────
  # 3. DEPLOY — trigger Render deploy hook
  # ─────────────────────────────────────────────────
  deploy-render:
    name: 🌐 Deploy to Render
    runs-on: ubuntu-latest
    needs: build                # wait for successful build only
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    environment:
      name: production
      url: https://bachir-karroudi-portfolio.onrender.com   # update with your Render URL

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "🚀 Triggering Render deployment..."
          RESPONSE=$(curl -s -o /tmp/render_response.json -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          
          echo "HTTP Status: $RESPONSE"
          cat /tmp/render_response.json

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ Render deployment triggered successfully!"
          else
            echo "❌ Failed to trigger deployment (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered at | ${{ github.event.head_commit.timestamp }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View on Render](https://dashboard.render.com)" >> $GITHUB_STEP_SUMMARY
