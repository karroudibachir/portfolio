# ===================================================================
# Render Blueprint — Portfolio Bachir Karroudi
# ===================================================================
# Déploiement automatique conteneurisé Docker sur Render (100% Gratuit)
# ===================================================================

services:
  - type: web
    name: bachir-karroudi-portfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 80
